name: Pages

# Publishes the project site: API reference rendered from docs/openapi.yaml, plus a
# coverage report generated by actually running the test suite here, so it cannot
# drift from the code.
#
# This does not deploy the API. Nothing here touches AWS or needs AWS credentials.
#
# The site is published by pushing the built output to the gh-pages branch, which
# GitHub serves directly. The Pages REST API is deliberately not used: enabling a
# Pages site through it requires more privilege than the workflow token carries,
# so actions/configure-pages fails with "Resource not accessible by integration".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate coverage report
        run: pytest tests/unit/ --cov=src --cov-report=html:_site/coverage --cov-fail-under=91

      - name: Assemble site
        run: |
          cp docs/site/index.html _site/index.html
          mkdir -p _site/api _site/images
          cp docs/site/api.html _site/api/index.html
          # Published as a file, not a directory: app.html's relative links ("./",
          # "./api/") then resolve the same way they do when the file is opened
          # locally, so the page needs no path rewriting between the two.
          cp docs/site/app.html _site/app.html
          cp docs/openapi.yaml  _site/api/openapi.yaml
          cp docs/evidence/images/*.png _site/images/
          # coverage.py writes a .gitignore that would exclude its own output.
          rm -f _site/coverage/.gitignore
          # Skip Jekyll so directories beginning with an underscore are served.
          touch _site/.nojekyll
          echo "Built $(find _site -type f | wc -l) files."

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
          echo "Published to gh-pages."
