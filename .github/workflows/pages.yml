name: Pages

# Publishes the project site: API reference rendered from docs/openapi.yaml, plus a
# coverage report generated by actually running the test suite here in CI.
#
# This does not deploy the API itself. Nothing in this workflow touches AWS and it
# requires no AWS credentials.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate coverage report
        run: pytest tests/unit/ --cov=src --cov-report=html:_site/coverage --cov-fail-under=80

      - name: Assemble site
        run: |
          cp docs/site/index.html _site/index.html
          mkdir -p _site/api _site/images
          cp docs/site/api.html   _site/api/index.html
          cp docs/openapi.yaml    _site/api/openapi.yaml
          cp docs/evidence/images/*.png _site/images/ 2>/dev/null || true
          # Coverage ships a .gitignore that would exclude the whole directory
          # from the Pages artifact.
          rm -f _site/coverage/.gitignore
          echo "Built:"; find _site -maxdepth 2 -type f | sort | sed 's/^/  /'

      - name: Configure Pages
        # enablement: true turns Pages on for the repository the first time this
        # runs, so no manual setup is needed in repository settings.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
