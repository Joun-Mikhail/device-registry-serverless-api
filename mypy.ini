# Type checking configuration.
#
# Scoped to src/ — the code that actually deploys. Tests are excluded on purpose:
# they lean on pytest fixtures and moto's dynamically generated clients, where
# full annotation costs more than it catches.
[mypy]
python_version = 3.12
mypy_path = src
packages = handlers,models,repositories,validation,utils,authorizers
warn_unused_configs = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True

# boto3 ships no inline types. boto3-stubs (in requirements-dev.txt) supplies them
# on a clean install, and this section is the fallback for environments where the
# stub package cannot be resolved — without it, a packaging quirk fails the whole
# run over an import mypy was never going to check anyway.
[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-moto.*]
ignore_missing_imports = True
