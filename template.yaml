AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Serverless Device Registry API — manages IoT devices using Lambda, API Gateway HTTP API,
  and DynamoDB. Deployed via AWS SAM.

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 128
    Timeout: 10
    Environment:
      Variables:
        DEVICES_TABLE: !Ref DevicesTable
        LOG_LEVEL: INFO

Parameters:
  AlarmEmail:
    Type: String
    Default: ""
    Description: >-
      Address to notify when an alarm fires. Left empty by default so the stack
      deploys without embedding a personal address in source control; set it at
      deploy time with --parameter-overrides. When empty, alarms still fire and
      are visible in the console, they just do not send mail.

  ErrorAlarmThreshold:
    Type: Number
    Default: 1
    Description: Lambda errors in a 5-minute window before the alarm fires.

  DurationAlarmThresholdMs:
    Type: Number
    Default: 3000
    Description: >-
      p99 duration in milliseconds before the alarm fires. Functions have a 10s
      timeout, so 3s of p99 means the slow path is within a factor of three of
      timing out.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev]
    Description: Deployment environment.

Conditions:
  # Only wire up the SNS subscription when an address was supplied, so the stack
  # is deployable by anyone without editing it.
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:

  # ── DynamoDB ──────────────────────────────────────────────────────────────

  DevicesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "device-registry-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: type
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: type-createdAt-index
          KeySchema:
            - AttributeName: type
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: device-registry

  # ── API authentication ────────────────────────────────────────────────────
  # The key itself is generated by CloudFormation and never appears in this
  # template, in source control, or in a function environment variable. Only the
  # secret's ARN is passed to the authorizer, which reads the value at runtime.

  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "device-registry/api-key-${Environment}"
      Description: Shared API key accepted by the Device Registry HTTP API.
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: device-registry

  ApiKeyAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "device-registry-authorizer-${Environment}"
      CodeUri: src/
      Handler: authorizers.api_key_authorizer.handler
      Description: Validates the x-api-key header against the stored secret.
      Environment:
        Variables:
          API_KEY_SECRET_ARN: !Ref ApiKeySecret
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref ApiKeySecret
      LoggingConfig:
        LogGroup: !Ref ApiKeyAuthorizerLogGroup

  # ── Lambda Functions ──────────────────────────────────────────────────────
  # Note: boto3 ships pre-installed in the Python Lambda runtime.
  # A Lambda Layer for dependencies is unnecessary here and was removed.

  CreateDeviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "device-registry-create-${Environment}"
      CodeUri: src/
      Handler: handlers.create_device.handler
      Description: Creates a new device entry in the registry.
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref DevicesTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceRegistryApi
            Method: POST
            Path: /devices
      LoggingConfig:
        LogGroup: !Ref CreateDeviceLogGroup

  GetDeviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "device-registry-get-${Environment}"
      CodeUri: src/
      Handler: handlers.get_device.handler
      Description: Retrieves a single device by ID.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DevicesTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceRegistryApi
            Method: GET
            Path: /devices/{deviceId}
      LoggingConfig:
        LogGroup: !Ref GetDeviceLogGroup

  ListDevicesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "device-registry-list-${Environment}"
      CodeUri: src/
      Handler: handlers.list_devices.handler
      Description: Returns all registered devices.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DevicesTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceRegistryApi
            Method: GET
            Path: /devices
      LoggingConfig:
        LogGroup: !Ref ListDevicesLogGroup

  UpdateDeviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "device-registry-update-${Environment}"
      CodeUri: src/
      Handler: handlers.update_device.handler
      Description: Updates one or more fields on an existing device.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DevicesTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceRegistryApi
            Method: PATCH
            Path: /devices/{deviceId}
      LoggingConfig:
        LogGroup: !Ref UpdateDeviceLogGroup

  DeleteDeviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "device-registry-delete-${Environment}"
      CodeUri: src/
      Handler: handlers.delete_device.handler
      Description: Removes a device from the registry.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DevicesTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref DeviceRegistryApi
            Method: DELETE
            Path: /devices/{deviceId}
      LoggingConfig:
        LogGroup: !Ref DeleteDeviceLogGroup

  # ── API Gateway HTTP API ──────────────────────────────────────────────────

  DeviceRegistryApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Description: HTTP API for the Device Registry service.
      Auth:
        # Applied to every route by default, so adding a route cannot
        # accidentally leave it unauthenticated.
        DefaultAuthorizer: ApiKeyAuthorizer
        Authorizers:
          ApiKeyAuthorizer:
            FunctionArn: !GetAtt ApiKeyAuthorizerFunction.Arn
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            EnableFunctionDefaultPermissions: true
            Identity:
              Headers:
                - x-api-key
              # Cache an identical key briefly so the authorizer is not invoked on
              # every request, while keeping revocation reasonably prompt.
              ReauthorizeEvery: 300
      Tags:
        Environment: !Ref Environment
        Project: device-registry

  # ── CloudWatch Log Groups (7-day retention) ───────────────────────────────

  ApiKeyAuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/device-registry-authorizer-${Environment}"
      RetentionInDays: 7

  CreateDeviceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/device-registry-create-${Environment}"
      RetentionInDays: 7

  GetDeviceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/device-registry-get-${Environment}"
      RetentionInDays: 7

  ListDevicesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/device-registry-list-${Environment}"
      RetentionInDays: 7

  UpdateDeviceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/device-registry-update-${Environment}"
      RetentionInDays: 7

  DeleteDeviceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/device-registry-delete-${Environment}"
      RetentionInDays: 7

  # ── Alerting ──────────────────────────────────────────────────────────────

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "device-registry-alarms-${Environment}"
      DisplayName: Device Registry alarms

  AlarmTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref AlarmTopic

  # Errors are summed across all five functions rather than alarmed per function:
  # one alarm that means "something is broken" beats five that each mean "one
  # route is broken", and the dashboard below shows which.
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "device-registry-${Environment}-lambda-errors"
      AlarmDescription: >-
        A Lambda function returned an unhandled error. Handled 4xx responses do
        not count — this only fires on a genuine failure.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref ErrorAlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # Absence of data means no traffic, not an outage.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "device-registry-${Environment}-lambda-p99-duration"
      AlarmDescription: >-
        p99 duration approaching the 10s function timeout. p99 rather than
        Average, because an average stays healthy while the slowest requests
        time out.
      Namespace: AWS/Lambda
      MetricName: Duration
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref DurationAlarmThresholdMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # PAY_PER_REQUEST still throttles: on-demand capacity ramps, so a sharp spike
  # can be rejected before the table scales.
  DynamoThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "device-registry-${Environment}-dynamodb-throttles"
      AlarmDescription: DynamoDB rejected requests because the table was throttled.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: TableName
          Value: !Ref DevicesTable
      AlarmActions: [!Ref AlarmTopic]

  # ── Dashboard ─────────────────────────────────────────────────────────────

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "device-registry-${Environment}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Invocations by route",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 300, "view": "timeSeries", "stacked": false,
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "device-registry-create-${Environment}", { "label": "create" } ],
                  [ "...", "device-registry-get-${Environment}", { "label": "get" } ],
                  [ "...", "device-registry-list-${Environment}", { "label": "list" } ],
                  [ "...", "device-registry-update-${Environment}", { "label": "update" } ],
                  [ "...", "device-registry-delete-${Environment}", { "label": "delete" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Errors by route",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 300, "view": "timeSeries", "stacked": true,
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "device-registry-create-${Environment}", { "label": "create" } ],
                  [ "...", "device-registry-get-${Environment}", { "label": "get" } ],
                  [ "...", "device-registry-list-${Environment}", { "label": "list" } ],
                  [ "...", "device-registry-update-${Environment}", { "label": "update" } ],
                  [ "...", "device-registry-delete-${Environment}", { "label": "delete" } ],
                  [ "...", "device-registry-authorizer-${Environment}", { "label": "authorizer" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Duration p50 / p99 (all routes)",
                "region": "${AWS::Region}",
                "period": 300, "view": "timeSeries",
                "metrics": [
                  [ "AWS/Lambda", "Duration", { "stat": "p50", "label": "p50" } ],
                  [ ".", ".", { "stat": "p99", "label": "p99" } ]
                ],
                "annotations": {
                  "horizontal": [
                    { "label": "p99 alarm", "value": ${DurationAlarmThresholdMs} },
                    { "label": "function timeout", "value": 10000 }
                  ]
                }
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB consumed capacity and throttles",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 300, "view": "timeSeries",
                "metrics": [
                  [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${DevicesTable}", { "label": "read" } ],
                  [ ".", "ConsumedWriteCapacityUnits", ".", ".", { "label": "write" } ],
                  [ ".", "ThrottledRequests", ".", ".", { "label": "throttled", "color": "#d62728" } ]
                ]
              }
            },
            {
              "type": "log", "x": 0, "y": 12, "width": 24, "height": 6,
              "properties": {
                "title": "Recent failures (status >= 500)",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '/aws/lambda/device-registry-create-${Environment}' | SOURCE '/aws/lambda/device-registry-get-${Environment}' | SOURCE '/aws/lambda/device-registry-list-${Environment}' | SOURCE '/aws/lambda/device-registry-update-${Environment}' | SOURCE '/aws/lambda/device-registry-delete-${Environment}' | fields @timestamp, operation, requestId, status, latencyMs | filter status >= 500 | sort @timestamp desc | limit 20"
              }
            }
          ]
        }

Outputs:
  ApiBaseUrl:
    Description: Base URL for the Device Registry API.
    Value: !Sub "https://${DeviceRegistryApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  ApiKeySecretArn:
    Description: >-
      ARN of the generated API key. Read the value with:
      aws secretsmanager get-secret-value --secret-id <arn> --query SecretString --output text
    Value: !Ref ApiKeySecret

  DashboardUrl:
    Description: CloudWatch dashboard for this stack.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=device-registry-${Environment}"

  AlarmTopicArn:
    Description: SNS topic the alarms publish to.
    Value: !Ref AlarmTopic

  DevicesTableName:
    Description: DynamoDB table name.
    Value: !Ref DevicesTable

  DevicesTableArn:
    Description: DynamoDB table ARN.
    Value: !GetAtt DevicesTable.Arn
